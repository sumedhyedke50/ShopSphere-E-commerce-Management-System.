
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopSphere | Login</title>

<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

	<!-- Navbar -->
	<header>
		<div class="logo">ShopSphere</div>

		<nav>
			<a th:href="@{/home}">Home</a> <a th:href="@{/products}">Products</a> <a
				th:href="@{/register}">Register</a>
		</nav>
	</header>

	<!-- Login Section -->
	<section class="login-section">

		<div class="login-container">

			<div class="login-header">
				<h1>Welcome Back!</h1>
				<p>Login to continue shopping with ShopSphere.</p>
			</div>

			<!-- Error message -->
			<div class="message error" th:if="${param.error}">Invalid email
				or password!</div>

			<!-- Logout message -->
			<div class="message success" th:if="${param.logout}">You have
				successfully logged out.</div>

			<!-- Login Form -->
			<form th:action="@{/login}" method="post">

				<div class="form-group">
					<label for="username">Email Address</label> <input type="email"
						id="username" name="username" placeholder="Enter your email"
						required>
				</div>

				<div class="form-group">
					<label for="password">Password</label> <input type="password"
						id="password" name="password" placeholder="Enter your password"
						required>
				</div>

				<div class="form-options">
					<label> <input type="checkbox" name="remember-me">
						Remember me
					</label>
				</div>

				<button type="submit" class="login-btn">Login</button>

			</form>

			<div class="register-link">
				<p>
					Don't have an account? <a th:href="@{/register}">Create Account</a>
				</p>
			</div>

		</div>

	</section>

	<!-- Footer -->
	<footer>
		<p>© 2026 ShopSphere. All Rights Reserved.</p>
	</footer>

</body>
</html>
